name: Build plugin zip

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build zip
        run: |
          cp README.md swc_grid_slope/README.md
          zip -r swc_grid_slope.zip swc_grid_slope -x "*/__pycache__/*"
      - uses: actions/upload-artifact@v4
        with:
          name: swc_grid_slope
          path: swc_grid_slope.zip
      - name: Attach to GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: swc_grid_slope.zip
